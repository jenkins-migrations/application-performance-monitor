name: CI

# Migrated from Jenkins scripted pipeline (Jenkinsfile).
# Jenkins had no explicit triggers, so the standard push/pull_request triggers are used.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: temurin

jobs:
  # Jenkins: node('linux') { exws(extWorkspace) { stage('Checkout') / stage('Build') / stage('Package') } }
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      # Jenkins: stage('Checkout') { checkout scm }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # Jenkins: stage('Build') { sh 'mvn clean install -DskipTests' }
      - name: Build
        run: mvn --batch-mode clean install -DskipTests

      # Jenkins: stage('Package') { sh 'mvn package -DskipTests' }
      - name: Package
        run: mvn --batch-mode package -DskipTests

      # Jenkins: archiveArtifacts artifacts: 'target/*.jar', fingerprint: true
      - name: Upload packaged jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jars
          path: target/*.jar
          if-no-files-found: warn

      # Replaces the Jenkins external workspace (exwsAllocate 'diskpool1' / exws) that shared
      # build output between the 'linux' and 'test' nodes.
      - name: Upload build output for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: target
          include-hidden-files: true
          if-no-files-found: warn

  # Jenkins: node('test') { exws(extWorkspace) { stage('Unit Tests') } }
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: target

      # Jenkins: sh 'mvn test'
      - name: Run unit tests
        run: mvn --batch-mode test

      # Jenkins: publishTestResults testResultsPattern: 'target/surefire-reports/*.xml'
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: target/surefire-reports/*.xml
          if-no-files-found: warn

  # Jenkins: node('test') { exws(extWorkspace) { stage('Integration Tests') } }
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: target

      # Jenkins: sh 'mvn failsafe:integration-test'
      - name: Run integration tests
        run: mvn --batch-mode failsafe:integration-test

      # Jenkins: publishTestResults testResultsPattern: 'target/failsafe-reports/*.xml'
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: target/failsafe-reports/*.xml
          if-no-files-found: warn
